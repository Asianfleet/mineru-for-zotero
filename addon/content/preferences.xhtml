<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<groupbox
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
>
  <vbox>
    <label>
      <html:h2 data-l10n-id="pref-api-service-title"></html:h2>
    </label>
    <hbox align="center" style="gap: 6px">
      <label
        for="zotero-prefpane-__addonRef__-api-key"
        data-l10n-id="pref-api-key"
      ></label>
      <html:input
        type="password"
        id="zotero-prefpane-__addonRef__-api-key"
        preference="apiKey"
      ></html:input>
    </hbox>
    <hbox align="center" style="gap: 6px">
      <label
        for="zotero-prefpane-__addonRef__-local-api-base-url"
        data-l10n-id="pref-local-api-base-url"
      ></label>
      <html:input
        type="text"
        id="zotero-prefpane-__addonRef__-local-api-base-url"
        preference="localApiBaseURL"
      >
      </html:input>
    </hbox>
    <hbox align="center" style="gap: 6px">
      <label
        for="zotero-prefpane-__addonRef__-local-api-timeout-minutes"
        data-l10n-id="pref-local-api-timeout-minutes"
      ></label>
      <html:input
        type="number"
        min="1"
        step="1"
        id="zotero-prefpane-__addonRef__-local-api-timeout-minutes"
        preference="localApiTimeoutMinutes"
        style="width: 72px; text-align: left"
      >
      </html:input>
    </hbox>
    <hbox align="center" style="gap: 6px">
      <label data-l10n-id="pref-api-source-title"></label>
      <radiogroup
        id="zotero-prefpane-__addonRef__-parse-source"
        orient="horizontal"
        native="true"
        preference="parseSource"
      >
        <radio data-l10n-id="pref-api-source-online" value="online" />
        <radio data-l10n-id="pref-api-source-local" value="local" />
      </radiogroup>
    </hbox>
    <hbox align="top" style="gap: 6px">
      <label
        data-l10n-id="pref-parse-tier-title"
        style="margin-top: 8px"
      ></label>
      <vbox style="margin-left: 8px">
        <radiogroup
          id="zotero-prefpane-__addonRef__-parse-tier"
          orient="horizontal"
          native="true"
          preference="parseTier"
        >
          <radio data-l10n-id="pref-parse-tier-flash" value="flash" />
          <radio data-l10n-id="pref-parse-tier-basic" value="basic" />
          <radio data-l10n-id="pref-parse-tier-standard" value="standard" />
          <radio data-l10n-id="pref-parse-tier-advanced" value="advanced" />
        </radiogroup>
        <html:div data-l10n-id="pref-parse-tier-help"></html:div>
      </vbox>
    </hbox>
    <hbox align="top" style="gap: 6px; margin-top: 12px">
      <html:button
        id="__addonRef__-open-task-manager"
        data-l10n-id="pref-open-task-manager"
      ></html:button>
    </hbox>
  </vbox>
  <vbox>
    <label>
      <html:h2 data-l10n-id="pref-query-api-title"></html:h2>
    </label>
    <checkbox
      id="zotero-prefpane-__addonRef__-api-enabled"
      data-l10n-id="pref-query-api-enabled"
      native="true"
      preference="apiEnabled"
    />
  </vbox>
  <vbox>
    <label>
      <html:h2 data-l10n-id="pref-data-storage-title"></html:h2>
    </label>
    <checkbox
      id="zotero-prefpane-__addonRef__-save-images"
      data-l10n-id="pref-save-images"
      native="true"
      preference="saveImages"
    />
    <vbox>
      <hbox align="center" style="gap: 6px; margin-top: 8px">
        <label
          for="zotero-prefpane-__addonRef__-sync-folder"
          data-l10n-id="pref-sync-folder"
        ></label>
        <html:input
          type="text"
          id="zotero-prefpane-__addonRef__-sync-folder"
          preference="syncFolder"
          placeholder="/path/to/agent/workspace"
          style="width: 250px"
        >
        </html:input>
        <html:button
          id="__addonRef__-sync-all"
          data-l10n-id="pref-sync-all-button"
        ></html:button>
      </hbox>
    </vbox>
    <vbox>
      <hbox align="center" style="gap: 6px; margin-top: 8px">
        <label
          for="zotero-prefpane-__addonRef__-auto-parse-page-limit"
          data-l10n-id="pref-auto-parse-page-limit"
        ></label>
        <html:input
          type="number"
          min="0"
          step="1"
          id="zotero-prefpane-__addonRef__-auto-parse-page-limit"
          preference="autoParsePageLimit"
          style="width: 72px; text-align: left"
        >
        </html:input>
      </hbox>
    </vbox>
    <vbox>
      <html:h2 data-l10n-id="pref-data-folder-title"></html:h2>
      <hbox style="gap: 6px">
        <html:button
          id="__addonRef__-open-data-folder"
          data-l10n-id="pref-open-data-folder"
        ></html:button>
      </hbox>
      <html:div id="__addonRef__-data-folder-path"></html:div>
      <html:div id="__addonRef__-parsed-count"></html:div>
    </vbox>
  </vbox>
  <vbox>
    <label>
      <html:h2 data-l10n-id="pref-about-title"></html:h2>
    </label>
    <html:label
      data-l10n-id="pref-help"
      data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'
    ></html:label>
    <html:div>
      <html:a
        id="__addonRef__-github-link"
        href="https://github.com/dingzy53/mineru-for-zotero"
        >Github</html:a
      >
      <html:span> · </html:span>
      <html:a id="__addonRef__-mineru-link" href="https://mineru.net/"
        >MinerU</html:a
      >
    </html:div>
  </vbox>
</groupbox>
